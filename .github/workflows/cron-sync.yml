name: Hardware Deals 30-Min Sync

on:
  schedule:
    # Runs every 30 minutes 24/7
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - master
    paths:
      - ".github/workflows/cron-sync.yml"

jobs:
  sync-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BonPlan Sync API
        run: |
          echo "Triggering deal sync on https://bonplan-six.vercel.app/api/sync..."
          RESPONSE=$(curl -s -L -X POST "https://bonplan-six.vercel.app/api/sync" --max-time 60)
          echo "API Response: $RESPONSE"
